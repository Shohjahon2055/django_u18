<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
</head>

<body style="
    margin: 0;
    padding: 20px;
    background-color: #f4f6f8;
    font-family: Arial, sans-serif;
">
    <div style="
        max-width: 600px;
        margin: 0 auto;
        padding: 30px;
        background-color: #ffffff;
        border-radius: 10px;
    ">
        <h1 style="margin-top: 0; color: #1e3a8a;">
            Salom, {{ user_name }}!  {{code}}
        </h1>

        <p style="font-size: 16px; line-height: 1.6; color: #333333;">
            Bu <strong>HTML formatidagi</strong> email xabari.
        </p>

        <p style="font-size: 16px; line-height: 1.6; color: #333333;">
            {{ message }}
        </p>

        <a
            href="{{ button_url }}"
            style="
                display: inline-block;
                padding: 12px 24px;
                background-color: #2563eb;
                color: #ffffff;
                text-decoration: none;
                border-radius: 6px;
                font-weight: bold;
            "
        >
            {{ button_text }}
        </a>

        <p style="margin-top: 30px; font-size: 14px; color: #777777;">
            Hurmat bilan,<br>
            <strong>Ustudy IT Akademiyasi</strong>
        </p>
    </div>
</body>
</html>
