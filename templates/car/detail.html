{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title fw-bold">{{ car.model }}</h2>
                <p class="fs-4 text-primary fw-bold">{{ car.price }} $</p>
                <p class="card-text text-secondary">{{ car.description }}</p>
                 <a href="{% url 'edit_car' car.pk %}">edit</a>
                 <a href="{% url 'delete_car' car.pk %}">delete</a>

            </div>
        </div>

<!--        <a href="{% url 'detail' car.id %}" class="btn btn-secondary mt-3">← Orqaga</a>-->
    </div>
</div>

{% endblock %}
